name: M10 verify + CMake build + cross-platform determinism

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the latest commit on a ref needs a hosted cross-platform receipt.
# Cancelling superseded matrices prevents a burst of already-integrated main
# pushes from exhausting the hosted runner queue before the current revision
# can start. Pull requests remain independent by head ref.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL3_TAG: release-3.2.14

jobs:
  localization-catalogs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GNU gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Verify source-generated and canonical POT/PO catalogs
        run: bash po/update.sh --check
      - name: Verify build-tree MO catalog generation
        run: |
          python3 tests/test_compile_gettext_catalogs.py
          python3 tools/compile_gettext_catalogs.py \
            --source-dir po --output-dir build/po-ci --verify-template
          if find po -type f -name '*.mo' -print -quit | grep -q .; then
            echo "::error::compiled gettext catalogs must not be stored in po/"
            exit 1
          fi

  repository-media-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Reject BIOS, firmware and original game media
        run: bash scripts/verify_no_original_media_tracked.sh

  nexus-tooling-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify regional retail identities in VDP1 source scans
        run: |
          python3 scripts/test_analyze_nexus_vdp1_source_join.py
          python3 scripts/test_analyze_nexus_vdp1_source_write_join.py
          python3 scripts/test_analyze_nexus_vdp1_write_trace.py

  release-notes-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Verify release-notes policy regression cases
        run: |
          python3 scripts/test_verify_release_notes.py
          python3 scripts/test_extract_release_notes.py

      - name: Verify reproducible SPDX source SBOM
        run: python3 tests/test_generate_spdx_sbom.py

  cmake-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        include:
          - os: ubuntu-24.04
            shell: bash
            generator: Ninja
            exe: ''
            full_ctest: true
            # Keep the full-source build within the runner's memory budget.
            # Unrestricted Ninja parallelism can starve the runner before the
            # production-boundary and CTest steps are reached.
            build_parallel: '3'
          - os: macos-14
            shell: bash
            generator: Unix Makefiles
            exe: ''
            full_ctest: true
            build_parallel: '3'
          - os: windows-2022
            shell: msys2 {0}
            generator: Ninja
            exe: '.exe'
            # Compile every production object through the shipping executable,
            # then portable headless probes and the focused DM1/CSB/DM2
            # startup-menu contract. Building all 940 CMake
            # targets on MSYS2 is redundant with the full Ubuntu/macOS CTest
            # matrix and can exceed the runner limit before any Windows binary
            # is exercised.
            build_targets: 'firestaff firestaff_m11_phase_a_probe firestaff_m11_audio_probe firestaff_m12_startup_flow_probe test_menu_hit_launch_direct_click_m12'
            full_ctest: false
            build_parallel: '3'

    runs-on: ${{ matrix.os }}
    # A platform build must fail visibly when the compiler or runner stalls.
    # Ubuntu and macOS compile every CMake target. Windows compiles the
    # shipping executable and portable probes, then runs them, so a stalled
    # MSYS2 test-target fan-out cannot mask the Windows product result.
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v5

      - name: Install SDL3 (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_REQUIRE_TAP_TRUST: '1'
        run: |
          if ! brew list --formula sdl3 >/dev/null 2>&1; then
            brew install sdl3
          fi

      - name: Install SDL3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols
          sdl_root="$RUNNER_TEMP/firestaff-sdl3"
          git clone --depth 1 --branch "$SDL3_TAG" https://github.com/libsdl-org/SDL.git "$sdl_root/source"
          cmake -S "$sdl_root/source" -B "$sdl_root/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF
          cmake --build "$sdl_root/build" --parallel
          sudo cmake --install "$sdl_root/build"
          sudo ldconfig

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3

      - name: CMake configure
        run: cmake -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release

      - name: CMake build
        run: |
          if [ -n "${{ matrix.build_targets }}" ]; then
            cmake --build build --target ${{ matrix.build_targets }} \
              --parallel "${{ matrix.build_parallel }}"
          elif [ -n "${{ matrix.build_parallel }}" ]; then
            cmake --build build --parallel "${{ matrix.build_parallel }}"
          else
            cmake --build build --parallel
          fi

      - name: Build launcher settings regressions
        run: |
          cmake --build build --parallel 2 --target \
            test_m12_launcher_options_runtime_handoff \
            test_m12_data_dir_cancel \
            test_m12_startup_font_artpack_settings

      - name: Run launcher settings regressions
        run: |
          # These exercise settings persistence and dialog ownership without
          # licensed game media. Original-media startup remains a separate gate.
          ctest --test-dir build --output-on-failure --no-tests=error \
            --parallel 2 --timeout 30 \
            -R '^(m12_launcher_options_runtime_handoff|m12_data_dir_cancel|m12_startup_font_artpack_settings)$'

      - name: Verify standalone Windows runtime bundle
        if: runner.os == 'Windows'
        run: |
          stage="$PWD/build/windows-runtime-check"
          mkdir -p "$stage"
          cp build/firestaff.exe "$stage/firestaff.exe"
          cmake -DFIRESTAFF_EXE="$PWD/build/firestaff.exe" \
            -DRUNTIME_DIR="$MINGW_PREFIX/bin" -DSTAGE_DIR="$stage" \
            -P scripts/bundle_windows_runtime.cmake
          # The smoke test must not find missing DLLs through MSYS2's PATH.
          system_path="$(cygpath -u "$SYSTEMROOT")/System32"
          PATH="$system_path" "$stage/firestaff.exe" --help

      - name: Run DM1/CSB/DM2 launcher click contract (all platforms)
        run: ./build/test_menu_hit_launch_direct_click_m12${{ matrix.exe }}

      - name: Run Nexus production source boundary
        if: matrix.full_ctest
        run: |
          ctest --test-dir build --output-on-failure \
            -R '^nexus_production_source_boundary$'

      - name: Run CSB FSSB production boundary
        if: matrix.full_ctest
        run: |
          ctest --test-dir build --output-on-failure \
            -R '^(csb_fssb_production_boundary|csb_compact_save_import_production_boundary|csb_cmp_import_production_boundary|csb_hidden_item_skip_production_boundary|csb_viewport_side_wall_production_boundary|csb_viewport_contract_bundle_production_boundary)$'

      - name: Run portable M12 startup menu test
        run: ctest --test-dir build --output-on-failure -R '^m12_startup_menu$'

      - name: Run M12 menu selection and launch regressions
        if: matrix.full_ctest
        run: |
          # Keep the shared launcher input, platform selection, row hitboxes,
          # resume gating and runtime handoff covered on full-test CI hosts.
          ctest --test-dir build --output-on-failure --no-tests=error \
            --parallel 4 --timeout 60 \
            -R '^(m12_menu_mouse|m12_auto_platform_priority|m12_menu_row_hit_height_audit|m12_quick_resume_gate|m12_launcher_options_runtime_handoff)$'

      - name: Run DM1, CSB and DM2 startup contracts
        if: matrix.full_ctest
        run: |
          # Exercise source startup/menu state and handoff contracts on both
          # Unix CI hosts. These tests use in-memory receipts or skip safely
          # when licensed media is required; they need no synthetic game data.
          ctest --test-dir build --output-on-failure --no-tests=error \
            --parallel 4 --timeout 60 \
            -R '^(csb_v1_startup_package_identity_pc34|csb_v1_startup_real_sequence_pc34_compat|csb_v1_startup_presentation_receipt_pc34_compat|csb_v1_startup_entrance_pointer_pc34_compat|csb_v1_startup_receipt_coherence_pc34_compat|csb_v1_startup_opening_door_tick_receipt_pc34_compat|csb_v1_f0806_f0825_startup_source_admission_pc34_compat|dm1_v1_f0437_f0438_f0439_startup_visual_admission_pc34_compat|dm1_v1_startup_f0267_party_placement_m11|dm1_v1_startup_intro_state_machine_gate|dm2_v1_startup_menu_action_contract|dm2_v1_startup_audio_menu|dm2_v1_m11_startup_profile_gate|dm2_v1_startup_pointer_hit_contract|dm2_v1_startup_music_queue|dm2_unsupported_platform_cli)$'

      - name: Run unit tests (ctest)
        if: matrix.full_ctest
        run: |
          cd build
          # The repository intentionally contains no licensed game media or
          # external ReDMCSB source tree.  The complete CTest inventory
          # therefore includes opt-in real-media/source-capture tests which
          # must run in the local licensed-data verification job, not on this
          # public asset-free matrix.  Keep the CI gate strict for every
          # production/source boundary that is self-contained.
          set -o pipefail
          ctest --output-on-failure --parallel 4 --timeout 60 \
            -R 'production|source_boundary' 2>&1 | tee ctest.log
          if grep -Eq '[1-9][0-9]* tests failed out of' ctest.log; then
            echo "::error::ctest reported failed tests"
            exit 1
          fi

      - name: Run Phase A probe (headless, no game data needed)
        run: |
          SDL_VIDEODRIVER=dummy ./build/firestaff_m11_phase_a_probe${{ matrix.exe }} 2>&1 | tee phase_a.log
          grep '^# summary: ' phase_a.log
          PASSED=$(grep '^# summary: ' phase_a.log | awk '{print $3}' | cut -d/ -f1)
          TOTAL=$(grep '^# summary: ' phase_a.log | awk '{print $3}' | cut -d/ -f2)
          if [ "$PASSED" != "$TOTAL" ]; then
            echo "::error::Phase A probe: $PASSED/$TOTAL"
            exit 1
          fi
          echo "Phase A probe: PASS ($PASSED/$TOTAL)"

      - name: Run Audio probe (no SDL3_mixer needed)
        run: |
          ./build/firestaff_m11_audio_probe${{ matrix.exe }} 2>&1 | tee audio.log
          grep '^# summary: ' audio.log
          PASSED=$(grep '^# summary: ' audio.log | awk '{print $3}' | cut -d/ -f1)
          TOTAL=$(grep '^# summary: ' audio.log | awk '{print $3}' | cut -d/ -f2)
          if [ "$PASSED" != "$TOTAL" ]; then
            echo "::error::Audio probe: $PASSED/$TOTAL"
            exit 1
          fi
          echo "Audio probe: PASS ($PASSED/$TOTAL)"

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        compiler: [default]
        include:
          - os: ubuntu-24.04
            cc: gcc
            shell: bash
          - os: macos-14
            cc: clang
            shell: bash
          - os: windows-2022
            cc: gcc
            shell: msys2 {0}

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup MSYS2 (Windows only)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Run M10 verify (when licensed assets are available)
        run: |
          chmod +x ./run_firestaff_m10_verify.sh
          if [ -f "$HOME/.firestaff/data/GRAPHICS.DAT" ]; then
            ./run_firestaff_m10_verify.sh "$HOME/.firestaff/data/GRAPHICS.DAT" 2>&1 | tee verify.log
            tail -20 verify.log
          else
            echo "SKIP: GRAPHICS.DAT not present on runner, so asset-dependent M10 verify is skipped." | tee verify.log
          fi

      - name: Assert all 20 phases PASS (if full verify ran)
        run: |
          if ! grep -q "^SKIP:" verify.log; then
            PASS_COUNT=$(grep -c ": PASS$" verify.log || echo 0)
            if [ "$PASS_COUNT" -lt 20 ]; then
              echo "::error::Expected 20 PASS, got $PASS_COUNT"
              exit 1
            fi
          else
            echo "Skipping PASS-count assertion because full verify did not run on this runner."
          fi

      - name: Compute deterministic world-hash
        run: |
          chmod +x ./run_firestaff_headless_driver.sh
          # Use a tiny synthetic dungeon file committed to tests/fixtures/
          if [ -f tests/fixtures/minimal.DAT ]; then
            ./run_firestaff_headless_driver.sh tests/fixtures/minimal.DAT --seed 42 --ticks 100 2>&1 | tee hash-${{ matrix.os }}.txt
            grep "final_hash:" hash-${{ matrix.os }}.txt > hash-only-${{ matrix.os }}.txt
          fi

      - name: Upload hash artefact
        if: hashFiles('hash-only-*.txt') != ''
        uses: actions/upload-artifact@v6
        with:
          name: determinism-hash-${{ matrix.os }}
          path: hash-only-*.txt

  cross-platform-determinism:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: determinism-hash-*
          merge-multiple: true

      - name: Compare hashes across platforms
        run: |
          echo "Hashes per platform:"
          cat hash-only-*.txt || echo "No hash files (skipping)"
          # All hash files must be byte-identical
          if ls hash-only-*.txt >/dev/null 2>&1; then
            FIRST=$(head -1 hash-only-ubuntu-24.04.txt)
            for f in hash-only-*.txt; do
              if [ "$(head -1 $f)" != "$FIRST" ]; then
                echo "::error::Determinism broken: $f differs from baseline"
                echo "baseline: $FIRST"
                echo "$f: $(head -1 $f)"
                exit 1
              fi
            done
            echo "✓ All platforms produced identical hash: $FIRST"
          fi

  warnings-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install SDL3 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols
          sdl_root="$RUNNER_TEMP/firestaff-sdl3"
          git clone --depth 1 --branch "$SDL3_TAG" https://github.com/libsdl-org/SDL.git "$sdl_root/source"
          cmake -S "$sdl_root/source" -B "$sdl_root/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF
          cmake --build "$sdl_root/build" --parallel
          sudo cmake --install "$sdl_root/build"
          sudo ldconfig
      - name: Probe compile sanity
        run: |
          shopt -s nullglob
          probes_found=0
          for probe in probes/*/firestaff_*_probe.c probes/firestaff_*_probe.c; do
            [ -f "$probe" ] || continue
            echo "=== $probe ==="
            if ! gcc -Wall -Wextra -Werror -Wno-format-truncation \
              -Iinclude -Isrc -Itests $(pkg-config --cflags sdl3) \
              -c -o "$RUNNER_TEMP/firestaff-probe.o" "$probe"; then
              echo "SKIP (legacy probe has unresolved optional dependencies): $probe"
            fi
            probes_found=1
          done
          if [ "$probes_found" = 0 ]; then echo "No probes matched — OK"; fi
          echo "Warnings check complete"

  asset-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Go (for lefthook installer)
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: false

      - name: Install lefthook
        # The public Go checksum service occasionally terminates an HTTP/2
        # stream while resolving Lefthook's transitive modules.  Retrying the
        # immutable install is safe and keeps that transient outage from
        # skipping the repository hygiene gate.
        run: |
          for attempt in 1 2 3; do
            if go install github.com/evilmartians/lefthook@latest; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1

      - name: Prepare empty asset data dir
        run: mkdir -p "$HOME/.firestaff/data"

      - name: Run asset-validate hash harmonization
        run: |
          python3 tools/asset-validate/compare_md5_to_sha256.py

      - name: Assert no original game data is tracked
        run: |
          python3 tools/asset-validate/no_game_data_in_git.py

      - name: Run asset-validate summary mode (Tier 1 #2)
        run: |
          if find "$HOME/.firestaff/data" -type f -print -quit | grep -q .; then
            python3 tools/asset-validate/compare_to_greatstone.py --summary
          else
            echo "SKIP: no local game data on CI runner, so asset coverage summary is advisory-only."
          fi

      - name: Run po layout structural validation
        run: |
          bash po/validate_po_layout.sh

      - name: Run lefthook ci (sanity)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          lefthook run ci
