name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Preserve repository-relative documentation links
        shell: bash
        run: |
          # Links from docs back to the repository README/LICENSE resolve
          # inside the Pages artifact as well.
          cp README.md docs/README.md
          cp README.md docs/README
          cp LICENSE docs/LICENSE
          # The Pages artifact is rooted at docs/. Markdown is intentionally
          # published as source text, so GitHub-style extensionless links must
          # have matching artifact paths instead of relying on repo rendering.
          find docs -type f -name '*.md' -print0 | while IFS= read -r -d '' file; do
            alias="${file%.md}"
            [ -e "$alias" ] || cp "$file" "$alias"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages can leave a valid deployment queued for longer than
          # the action's 10-minute default. Keep transient service backlog
          # from failing an otherwise verified main push.
          timeout: 1200000
