name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "scripts/prepare_pages.py", "scripts/restore_pages_literals.py", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", "README.md", "scripts/prepare_pages.py", "scripts/restore_pages_literals.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Jekyll source and HTML links
        run: python3 scripts/prepare_pages.py --output _pages_source
      - uses: actions/configure-pages@v5
      - name: Build documentation as HTML
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages_source
          destination: ./_site
      - name: Restore literal Liquid examples
        run: python3 scripts/restore_pages_literals.py --site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages can leave a valid deployment queued for longer than
          # the action's 10-minute default. Keep transient service backlog
          # from failing an otherwise verified main push.
          timeout: 1200000
